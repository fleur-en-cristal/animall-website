<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cảm ơn - Animall</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/checkout.css" />

  <!-- boxicons link (icons in header.js) -->
  <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">

  <!-- google fonts link -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body class="thankyou-page">
  <!-- header, search, cart dùng chung -->
  <script src="partials/header.js"></script>

  <section class="checkout thankyou">
    <div class="thankyou-shell">
      <div class="thankyou-card">
        <div class="thankyou-grid">
          <div class="thankyou-visual" aria-hidden="true">
            <img class="thankyou-img" src="image/thank-you.png" alt="" loading="lazy" />
          </div>

          <div class="thankyou-main">
            <h2>Cảm ơn bạn đã đặt hàng!</h2>
            <p>Đơn hàng của bạn đã được tiếp nhận và sẽ được xử lý trong thời gian sớm nhất.</p>
            <p id="orderInfo" class="thankyou-order"></p>

            <div class="actions thankyou-actions">
              <a class="btn-outline" href="products.html">Tiếp tục mua sắm</a>
              <a class="btn-primary" href="index.html">Về trang chủ</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- section liên hệ dùng chung-->
  <script src="partials/contact.js"></script>
  <!-- footer dùng chung -->
  <script src="partials/footer.js"></script>
  <!-- javascript link -->
  <script src="js/script.js"></script>
  <!-- giỏ hàng -->
  <script src="js/cart.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    if(id){ document.getElementById('orderInfo').textContent = 'Mã đơn hàng: ' + id; }
  </script>
</body>
</html>
