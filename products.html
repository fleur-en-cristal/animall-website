<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tất cả sản phẩm - Animall</title>
    <link rel="stylesheet" href="css/style.css" />

    <!-- liên kết Boxicons -->
    <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
    <!-- liên kết Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- header, search, cart dùng chung -->
    <script src="partials/header.js"></script>

    <section class="food" id="catalog">
        <div class="top-food">
            <!-- Thanh cá nhân hóa Pet Profile (được tạo bởi js/script.js) -->
            <div id="petPersonalizationBar" class="pet-bar" style="display:none;" aria-live="polite"></div>
        </div>
        <div class="food-product" id="catalogGrid"></div>
    </section>

    <!-- section liên hệ dùng chung-->
    <script src="partials/contact.js"></script>
    <!-- footer dùng chung -->
    <script src="partials/footer.js"></script>
    <!-- liên kết JavaScript -->
    <script src="js/script.js"></script>
    <!-- giỏ hàng -->
    <script src="js/cart.js"></script>

</body>

</html>
